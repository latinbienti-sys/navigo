<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Navigo – Ruta vocacional</title>
  <meta name="description" content="Navigo: experiencia gamificada de orientación vocacional para estudiantes de bachillerato en Venezuela. Descubre tus intereses, habilidades, valores y competencias.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar" id="topbar">
    <button class="brand" data-go="mapa" aria-label="Ir al mapa">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" width="34" height="34"><circle cx="20" cy="20" r="18" fill="var(--sea)"/><path d="M20 6 L25 20 L20 34 L15 20 Z" fill="var(--sun)"/><path d="M20 6 L25 20 L15 20 Z" fill="#fff" opacity=".9"/><circle cx="20" cy="20" r="3" fill="var(--ink)"/></svg>
      </span>
      <span class="brand-text">Navigo<small>la ruta de tu talento</small></span>
    </button>
    <div class="hud" id="hud" hidden>
      <span class="hud-avatar" id="hudAvatar"></span>
      <div class="hud-xp">
        <div class="hud-rank"><b id="hudRank">Grumete</b> · <span id="hudXp">0</span> XP</div>
        <div class="xpbar"><span id="hudBar"></span></div>
      </div>
    </div>
    <nav class="topnav">
      <button data-go="fundamentos">Fundamentos</button>
      <button data-go="orientador">Orientador</button>
    </nav>
  </header>

  <main id="app" tabindex="-1"></main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <footer class="foot">
    Navigo · Prototipo de orientación vocacional gamificada para bachillerato · Mérida, Venezuela.
    Los resultados son una guía para conversar con tu orientador(a), no un diagnóstico definitivo.
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
